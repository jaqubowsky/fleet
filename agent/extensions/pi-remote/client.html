<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="referrer" content="no-referrer" />
		<title>Pi remote</title>
		<link rel="stylesheet" href="/client.css" />
		<script src="/client.js" defer></script>
	</head>
	<body>
		<header>
			<h1>Pi remote</h1>
			<p id="session">Connecting</p>
			<p id="status" role="status">Connecting</p>
		</header>
		<main id="transcript" aria-label="Conversation"></main>
		<section id="activity" aria-label="Live activity"></section>
		<form id="command">
			<label for="text">Message</label>
			<textarea id="text" maxlength="8192" rows="3" required></textarea>
			<label for="action">Delivery</label>
			<select id="action">
				<option value="prompt">Prompt when idle</option>
				<option value="steer">Steer current run</option>
				<option value="followUp">Follow up after run</option>
			</select>
			<div class="buttons">
				<button id="send" type="submit" disabled>Send</button
				><button id="abort" type="button" disabled>Abort</button>
			</div>
			<p id="feedback" role="status"></p>
		</form>
	</body>
</html>
