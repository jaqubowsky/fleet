<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Without fleet you watch three terminals, each waiting on you. With fleet you talk to one host agent, and it runs the three sandboxes.">
<style>@font-face{font-family:"Kalam";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Kalam";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.s{stroke:#d6dbe1;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.box{fill:#151a20;stroke:#d6dbe1;stroke-width:2.2}
.soft{fill:#1c2636;stroke:#d6dbe1;stroke-width:2.2}
.t{font:700 18px "Kalam",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#e4e7eb}
.h{font:15px "Kalam",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#9aa3ad}
.m{font:12.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;fill:#e4e7eb}
.okF{fill:#4cc27d}.badF{fill:#f07563}.accF{fill:#6ea2ff}.warnF{fill:#e0a84a}
.wS{stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
