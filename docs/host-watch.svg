<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-label="The host wakes when a sandbox finishes, asks a question, stalls, hits the usage limit or fills its context, and handles each">
<style>@font-face{font-family:"Kalam";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Kalam";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.s{stroke:#2a2f36;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.box{fill:#ffffff;stroke:#2a2f36;stroke-width:2.2}
.soft{fill:#e9eef8;stroke:#2a2f36;stroke-width:2.2}
.t{font:700 18px "Kalam",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#1d2127}
.h{font:15px "Kalam",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#5d6570}
.m{font:12.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;fill:#1d2127}
.okF{fill:#1f8a4c}.badF{fill:#c8402f}.accF{fill:#2f6fdb}.warnF{fill:#b7791f}
.wS{stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="s"/></marker></defs>
        <g filter="url(#rough)"><circle cx="430" cy="150" r="78" class="soft"/></g>
        <text x="430" y="144" text-anchor="middle" class="t" style="font-size:24px">host</text>
        <text x="430" y="170" text-anchor="middle" class="h" style="font-size:13px">wakes when a sandbox…</text>
        <g class="s" marker-end="url(#arr)">
          <path d="M250 82 C300 82 330 96 360 116"/>
          <path d="M610 82 C560 82 530 96 500 116"/>
          <path d="M250 242 C300 242 330 214 362 190"/>
          <path d="M610 242 C560 242 530 214 498 190"/>
          <path d="M430 290 V236"/>
        </g>
        <text x="20" y="72" class="t">finishes</text>
        <text x="20" y="96" class="h">checks the evidence, lands on your word</text>
        <text x="620" y="72" class="t">asks a question</text>
        <text x="620" y="96" class="h">answers it, or asks you</text>
        <text x="20" y="232" class="t">stalls 20 minutes</text>
        <text x="20" y="256" class="h">looks at what it's doing</text>
        <text x="620" y="232" class="t">hits the usage limit</text>
        <text x="620" y="256" class="h">resumes it after the reset</text>
        <text x="430" y="312" text-anchor="middle" class="t">fills its context</text>
        <text x="430" y="334" text-anchor="middle" class="h">compacts it at 400k on its own</text>
      </svg>
