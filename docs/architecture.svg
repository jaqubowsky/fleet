<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" width="880" height="468" role="img" aria-labelledby="title">
<title id="title">Architecture: one repository renders a host seat and a container seat per harness</title>
<style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#afb8c1;--box:#f6f8fa;--accent:#0969da;--ok:#1a7f37;--bad:#cf222e;--warn:#9a6700}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#656c76;--box:#161b22;--accent:#4493f8;--ok:#3fb950;--bad:#f85149;--warn:#d29922}}
.bg{fill:var(--bg)}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.host{fill:var(--box);stroke:var(--accent);stroke-width:2}
.t{fill:var(--fg);font:600 15px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.s{fill:var(--muted);font:13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.m{fill:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.edge{fill:none;stroke:var(--line);stroke-width:1.8}
.dash{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}
.dot{fill:var(--accent)}
.okf{fill:var(--ok)} .badf{fill:var(--bad)} .warnf{fill:var(--warn)}
.ok{fill:var(--box);stroke:var(--ok);stroke-width:2} .bad{fill:var(--box);stroke:var(--bad);stroke-width:2} .warn{fill:var(--box);stroke:var(--warn);stroke-width:2}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker></defs>
<rect class="bg" width="880" height="468" rx="12"/>
<rect class="box" x="40" y="20" width="800" height="124" rx="10"/>
<text class="t" x="440" y="48" text-anchor="middle">~/harness, the only place to edit</text>
<text class="s" x="64" y="78" text-anchor="start">written once</text>
<text class="m" x="64" y="100" text-anchor="start">rules/  skills/  agents/  fragments/</text>
<text class="m" x="64" y="122" text-anchor="start">src/ (fleet CLI, guard, render)  sbx/container/</text>
<text class="s" x="470" y="78" text-anchor="start">per harness</text>
<text class="m" x="470" y="100" text-anchor="start">pi/  claude/</text>
<text class="m" x="470" y="122" text-anchor="start">settings, hooks or extensions, image</text>
<text class="s" x="440" y="176" text-anchor="middle">src/render: {{tokens}} filled per harness and seat</text>
<path class="edge" d="M440 186 C440 214 230 206 230 238" marker-end="url(#a)"/>
<path class="edge" d="M440 186 C440 214 650 206 650 238" marker-end="url(#a)"/>
<path class="edge" d="M440 144 L440 160"/>
<rect class="host" x="40" y="240" width="380" height="124" rx="10"/>
<text class="t" x="64" y="268" text-anchor="start">host seat, this Mac</text>
<text class="s" x="64" y="292" text-anchor="start">./sync.sh --apply, fleet render</text>
<text class="m" x="64" y="318" text-anchor="start">~/.pi   ~/.claude</text>
<text class="s" x="64" y="342" text-anchor="start">rules with host.md, host skills</text>
<rect class="host" x="460" y="240" width="380" height="124" rx="10"/>
<text class="t" x="484" y="268" text-anchor="start">container seat, one image per harness</text>
<text class="s" x="484" y="292" text-anchor="start">fleet build, then sbx/build.sh</text>
<text class="m" x="484" y="318" text-anchor="start">my-pi:v1   my-claude:v1</text>
<text class="s" x="484" y="342" text-anchor="start">rules with sandbox.md, container skills</text>
<rect class="box" x="40" y="396" width="800" height="52" rx="10"/>
<text class="m" x="64" y="420" text-anchor="start">~/.config/harness/</text>
<text class="s" x="230" y="420" text-anchor="start">your private values: repos.json, projects/, git/, claude-settings.json</text>
<text class="s" x="64" y="440" text-anchor="start">read by render, fleet and sync.sh; never written by an agent</text>
<path class="dash" d="M230 396 L230 366" marker-end="url(#a)"/>
<path class="dash" d="M650 396 L650 366" marker-end="url(#a)"/>
<circle class="dot" r="6"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M440 144 L440 186 C440 214 230 206 230 238"/></circle>
<circle class="dot" r="6"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" path="M440 144 L440 186 C440 214 650 206 650 238"/></circle>
<circle class="dot" r="4"><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M230 396 L230 366"/></circle>
<circle class="dot" r="4"><animateMotion dur="2s" begin="-1.5s" repeatCount="indefinite" path="M650 396 L650 366"/></circle>
</svg>
