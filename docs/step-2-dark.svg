          <text x="80" y="100" text-anchor="middle" class="t">host</text>
          <g class="s" marker-end="url(#arr)"><path d="M144 86 C190 80 196 40 234 38"/><path d="M144 94 H234"/><path d="M144 102 C190 108 196 148 234 150"/></g>
