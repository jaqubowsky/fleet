<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" role="img" aria-label="The sandbox analyzes, cuts tickets, writes tests and code per ticket, gets a review from a fresh agent and checks the running app. It hands the host screenshots, a summary and the diff; the host reads those, not the chat.">
<style>@font-face{font-family:"Kalam";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Kalam";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.s{stroke:#2a2f36;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.box{fill:#ffffff;stroke:#2a2f36;stroke-width:2.2}
.soft{fill:#e9eef8;stroke:#2a2f36;stroke-width:2.2}
.t{font:700 18px "Kalam",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#1d2127}
.h{font:15px "Kalam",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#5d6570}
.m{font:12.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;fill:#1d2127}
.okF{fill:#1f8a4c}.badF{fill:#c8402f}.accF{fill:#2f6fdb}.warnF{fill:#b7791f}
.wS{stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="s"/></marker></defs>
        <g filter="url(#rough)">
          <rect x="10" y="16" width="840" height="170" rx="22" class="box" stroke-dasharray="9 7"/>
          <rect x="30" y="72" width="104" height="56" rx="14" class="box"/>
          <rect x="152" y="72" width="100" height="56" rx="14" class="box"/>
          <rect x="270" y="72" width="130" height="56" rx="14" class="box"/>
          <rect x="418" y="72" width="120" height="56" rx="14" class="box"/>
          <rect x="560" y="46" width="270" height="112" rx="14" class="box"/>
          <rect x="10" y="236" width="840" height="162" rx="22" class="soft"/>
          <rect x="200" y="258" width="200" height="120" rx="12" class="box"/>
          <rect x="420" y="258" width="200" height="120" rx="12" class="box"/>
          <rect x="640" y="258" width="190" height="120" rx="12" class="box"/>
        </g>
        <text x="30" y="42" class="h">sandbox</text>
        <text x="82" y="106" text-anchor="middle" class="t">analyze</text>
        <text x="202" y="106" text-anchor="middle" class="t">tickets</text>
        <text x="335" y="106" text-anchor="middle" class="t">test + code</text>
        <text x="478" y="100" text-anchor="middle" class="t">review</text>
        <text x="478" y="120" text-anchor="middle" class="h" style="font-size:13px">fresh agent</text>
        <g class="s" marker-end="url(#arr)"><path d="M136 100h12"/><path d="M254 100h12"/><path d="M402 100h12"/><path d="M540 100h16"/></g>
        <path d="M372 130 C372 158 298 158 298 130" class="s" marker-end="url(#arr)"/>
        <text x="335" y="176" text-anchor="middle" class="h" style="font-size:13px">per ticket</text>

        <path d="M560 72 H830" class="s" opacity=".4"/>
        <circle cx="576" cy="59" r="4" class="badF" opacity=".7"/><circle cx="590" cy="59" r="4" class="warnF" opacity=".7"/><circle cx="604" cy="59" r="4" class="okF" opacity=".7"/>
        <text x="716" y="64" text-anchor="middle" class="h" style="font-size:13px">checks the running app</text>
        <g class="s" style="stroke-width:1.8"><rect x="576" y="86" width="72" height="54" rx="6"/><rect x="659" y="86" width="72" height="54" rx="6"/><rect x="742" y="86" width="72" height="54" rx="6"/></g>
        <circle cx="640" cy="94" r="9" class="okF"/><path d="M636 94l3 3 5-6" class="wS" style="stroke-width:2"/><circle cx="723" cy="94" r="9" class="okF"/><path d="M719 94l3 3 5-6" class="wS" style="stroke-width:2"/><circle cx="806" cy="94" r="9" class="okF"/><path d="M802 94l3 3 5-6" class="wS" style="stroke-width:2"/>

        <path d="M430 188 V230" class="s" marker-end="url(#arr)" style="stroke-width:2.6"/>
        <text x="446" y="216" class="h">hands over</text>

        <text x="30" y="290" class="t" style="font-size:22px">host</text>
        <text x="30" y="316" class="h">reads the evidence,</text>
        <text x="30" y="338" class="h">not the chat</text>

        <text x="216" y="282" class="h" style="font-size:14px">screenshots</text>
        <g class="s" style="stroke-width:1.6"><rect x="216" y="296" width="52" height="40" rx="5"/><rect x="274" y="296" width="52" height="40" rx="5"/><rect x="332" y="296" width="52" height="40" rx="5"/></g>
        <circle cx="262" cy="302" r="7" class="okF"/><path d="M258 302l3 3 5-6" class="wS" style="stroke-width:2"/><circle cx="320" cy="302" r="7" class="okF"/><path d="M316 302l3 3 5-6" class="wS" style="stroke-width:2"/><circle cx="378" cy="302" r="7" class="okF"/><path d="M374 302l3 3 5-6" class="wS" style="stroke-width:2"/>
        <text x="216" y="362" class="m" style="font-size:12px;fill:#1f8a4c">3 of 3 criteria</text>

        <text x="436" y="282" class="h" style="font-size:14px">summary</text>
        <text x="436" y="312" class="m" style="font-size:12px">status: ready</text>
        <text x="436" y="336" class="m" style="font-size:12px">review: pass</text>
        <text x="436" y="360" class="m" style="font-size:12px">tests: green</text>

        <text x="656" y="282" class="h" style="font-size:14px">diff</text>
        <text x="656" y="316" class="m" style="font-size:15px"><tspan style="fill:#1f8a4c">+214</tspan> <tspan style="fill:#c8402f">-38</tspan></text>
        <text x="656" y="342" class="m" style="font-size:12px;opacity:.7">6 files, 3 commits</text>
      </svg>
