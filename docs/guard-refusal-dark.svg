<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210" role="img" aria-label="An agent runs git push --force origin main and the guard stops it: a force, delete or mirror push rewrites what other people already hold">
<style>@font-face{font-family:"Kalam";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Kalam";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}.s{stroke:#d6dbe1;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.box{fill:#151a20;stroke:#d6dbe1;stroke-width:2.2}
.soft{fill:#1c2636;stroke:#d6dbe1;stroke-width:2.2}
.t{font:700 18px "Kalam",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#e4e7eb}
.h{font:15px "Kalam",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#9aa3ad}
.m{font:12.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;fill:#e4e7eb}
.okF{fill:#4cc27d}.badF{fill:#f07563}.accF{fill:#6ea2ff}.warnF{fill:#e0a84a}
.wS{stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="s"/></marker></defs>
        <g filter="url(#rough)"><rect x="10" y="10" width="840" height="190" rx="16" class="box"/></g>
        <path d="M12 48 H848" class="s" opacity=".35"/>
        <circle cx="36" cy="30" r="6" class="badF" opacity=".7"/><circle cx="56" cy="30" r="6" class="warnF" opacity=".7"/><circle cx="76" cy="30" r="6" class="okF" opacity=".7"/>
        <text x="430" y="35" text-anchor="middle" class="h">agent in a sandbox</text>
        <text x="36" y="88" class="m" style="font-size:17px"><tspan class="h" style="font-size:17px">agent ›</tspan> git push --force origin main</text>
        <g filter="url(#rough)"><rect x="30" y="112" width="800" height="68" rx="12" style="fill:#f07563;opacity:.1;stroke:#f07563;stroke-width:2"/></g>
        <circle cx="62" cy="146" r="14" class="badF"/><path d="M57 141l10 10M67 141l-10 10" class="wS"/>
        <text x="92" y="140" class="t" style="fill:#f07563;font-size:17px">stopped by the guard</text>
        <text x="92" y="164" class="h">A force, delete or mirror push rewrites what other people already hold.</text>
      </svg>
