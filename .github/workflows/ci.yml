name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: brew install bash
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: |
          npm install --prefix "$RUNNER_TEMP/pi-npm" --legacy-peer-deps \
            $(jq -rs 'map(.packages[]) | unique | .[] | sub("^npm:"; "")' pi/profiles/host.json pi/profiles/sbx.json)
          echo "PI_NPM_MODULES=$RUNNER_TEMP/pi-npm/node_modules" >> "$GITHUB_ENV"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: npm run check
      - run: npm test
