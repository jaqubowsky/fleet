name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: npm run check
      - run: npm test
