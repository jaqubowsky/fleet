id = "pi"
version = "2026.09.15.3"
min_engine_version = 1
updated_at = "2026-09-15T00:00:00Z"
aliases = ["herdr:pi"]

# --- blocked: the worker is stuck waiting for a human ---

[[rules]]
id = "auth_expired"
state = "blocked"
priority = 200
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["authentication token is expired"] },
  { contains = ["token is expired"] },
  { contains = ["token_expired"] },
]

[[rules]]
id = "login_needed"
state = "blocked"
priority = 200
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["Use /login to log into a provider"] },
  { contains = ["No models available"] },
  { contains = ["Sign in to"] },
  { contains = ["Sign in with"] },
  { contains = ["log in to your provider"] },
  { contains = ["not authenticated"] },
]

[[rules]]
id = "project_untrusted"
state = "blocked"
priority = 190
region = "whole_recent"
visible_blocker = true
contains = ["This project is not trusted"]

[[rules]]
id = "confirm_dialog"
state = "blocked"
priority = 150
region = "bottom_non_empty_lines(8)"
visible_blocker = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["enter to confirm"] },
  { contains = ["y/N"] },
  { contains = ["Y/n"] },
]

# --- working: nested async subagents still running in the sandbox ---
# The parent turn ends and the top-level banner clears, but pi-subagents keeps a
# live FleetView / pi-lens panel at the bottom of the screen while background
# children run. There is no herdr inside the sandbox, so this screen panel is the
# only signal. Match the active-run count and running markers in the bottom panel
# only (not the static spawn tool-output higher up), so the pane reads `working`
# until the children settle and the panel flips to `0 active` / `complete`.

[[rules]]
id = "subagents_active"
state = "working"
priority = 120
region = "bottom_non_empty_lines(10)"
visible_working = true
any = [
  { regex = ['[1-9][0-9]* active\b'] },
  { contains = ["· running"] },
  { contains = ["workflow · running"] },
]

# --- working: the model is producing output ---

[[rules]]
id = "working_banner"
state = "working"
priority = 110
region = "whole_recent"
visible_working = true
regex = ['(?m)^\s*[─—-]+\s*[\x{2800}-\x{28FF}]\s*Working\s*[─—-]+']

[[rules]]
id = "working_literal"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["Working..."]
