onboarding = false

[ui]
status_indicators = "dots"
agent_panel_sort = "priority"
tab_bar_position = "top"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"], ["state_text", { token = "$pr", fg = "#50fa7b", bold = true }]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[theme]
name = "dracula"
auto_switch = false

[keys]
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "fleet diff"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "fleet pr"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "fleet notes"
