<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="theme-color"
      content="#fbfbfa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12120f"
      media="(prefers-color-scheme: dark)"
    />
    <title>Pi remote</title>
    <link
      rel="stylesheet"
      href="/vendor/highlight-light.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="stylesheet"
      href="/vendor/highlight-dark.css"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/client.css" />
    <script type="module" src="/client.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <h1 id="session-name">Pi remote</h1>
        <span id="status" class="pill">Connecting</span>
        <span id="connection" class="dot" aria-hidden="true"></span>
        <button id="notify" class="ghost" type="button" hidden>Notify</button>
      </div>
      <ul id="facts" class="facts" aria-label="Session"></ul>
    </header>

    <p id="banner" class="banner" hidden></p>

    <main id="thread" class="thread">
      <div id="empty" class="empty" hidden>
        <h2>Nothing yet</h2>
        <p>Send a message and Pi's reply lands here.</p>
      </div>
      <div id="transcript"></div>
      <div id="activity" class="activity" aria-label="Running now"></div>
    </main>

    <p id="live" class="visually-hidden" role="status" aria-live="polite"></p>

    <button id="jump" class="jump" type="button" hidden>Latest</button>

    <footer class="dock">
      <form id="command" class="composer">
        <textarea
          id="text"
          maxlength="8192"
          rows="1"
          required
          placeholder="Message Pi"
          aria-label="Message Pi"
        ></textarea>
        <div class="row">
          <div
            class="delivery"
            role="group"
            aria-label="How the message is delivered"
          >
            <button type="button" data-mode="steer" aria-pressed="false">
              Steer</button
            ><button type="button" data-mode="followUp" aria-pressed="true">
              Queue
            </button>
          </div>
          <span class="spacer"></span>
          <button id="abort" class="ghost" type="button" disabled>Stop</button
          ><button id="send" class="primary" type="submit" disabled>
            Send
          </button>
        </div>
        <p id="feedback" class="feedback" role="status"></p>
      </form>
      <p id="view-note" class="note" hidden>
        This link watches only. Ask for the control link to send.
      </p>
    </footer>
  </body>
</html>
